# Validación local: goreleaser check && goreleaser release --snapshot --clean
version: 2

project_name: nautago

before:
  hooks:
    - go mod verify

builds:
  - id: nauta
    main: ./cmd/nauta
    binary: nauta
    env:
      # Requiere que todas las dependencias sean Go puro, como modernc.org/sqlite.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X github.com/plinkr/nautago/internal/cli.version=v{{ .Version }}
    # Builds reproducibles: fecha del commit en vez de la hora de compilación.
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
      # Raspberry Pi: ARMv6 para Pi Zero/1 y ARMv7 para Pi 2/3/4 con SO de 32 bits.
      - linux_arm_6
      - linux_arm_7
      - windows_amd64_v1
      - darwin_amd64_v1
      - darwin_arm64_v8.0

archives:
  - id: nauta
    ids: [nauta]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - LICENSE.md
      - README.md
      - README_ES.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  prerelease: auto
